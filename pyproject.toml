[project]
name = "prod-rag"
version = "1.0.0"
description = "Enterprise Agentic RAG Platform"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Async / HTTP
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # Cache
    "redis[hiredis]>=5.2.0",

    # Vector Store
    "qdrant-client>=1.12.0",

    # Search
    "elasticsearch[async]>=8.16.0",

    # Document Parsing
    "docling>=2.12.0",
    "unstructured[all-docs]>=0.16.0",

    # Embeddings / Reranking
    "openai>=1.56.0",
    "sentence-transformers>=3.3.0",
    "tiktoken>=0.8.0",
    "torch>=2.2.2,<3.0.0",
    "torchvision>=0,<1",

    # LLM Providers
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.4.0",

    # Evaluation
    "ragas>=0.2.0",
    "deepeval>=1.4.0",

    # Observability
    "langfuse>=2.0.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",

    # Validation / Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # DI Container
    "dependency-injector>=4.41.0",

    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "cohere>=5.11.0",

    # UI
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "altair>=5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["src/ui/*", "*/migrations/*"]
