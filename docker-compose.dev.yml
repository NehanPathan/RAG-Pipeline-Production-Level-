# Development overrides, layered on docker-compose.yml by `make dev`.
#
# The Makefile has referenced this file since the project began but it was
# never created, so `make dev` failed with a missing-file error. Everything
# here is a development-only convenience; production runs the base compose
# file alone.

services:
  api:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      # Development identity when Firebase is off. Ignored entirely once
      # FIREBASE_ENABLED=true, since a verified token then supplies the
      # identity and this header is not consulted.
      - APP_DEBUG=true
    # --reload restarts uvicorn when src/ changes, which the bind mount below
    # makes visible inside the container. Note this reloads the ML models too,
    # so an edit costs a few seconds of startup.
    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./config:/app/config:ro
      # Migrations and scripts, so `docker compose exec api alembic ...` and
      # the governance scripts work against live code rather than a stale
      # image layer.
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini:ro
      - ./docs:/app/docs:ro

  # In development the frontend runs the Vite dev server instead of nginx, so
  # an edit is a hot reload rather than an image rebuild. `target: builder`
  # reuses the first stage of docker/frontend.Dockerfile, which already has
  # Node and an installed node_modules.
  frontend:
    build:
      target: builder
    command: ["npm", "run", "dev"]
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_PORT=8080
      # The browser reaches the dev server on the published host port, not on
      # 8080, and the HMR websocket has to be told so.
      - VITE_HMR_CLIENT_PORT=15173
      - VITE_API_TARGET=http://api:8000
    volumes:
      # Only the source is mounted. Mounting ./frontend wholesale would shadow
      # the container's node_modules with the host's, which on Windows means
      # native binaries built for the wrong platform.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json

  streamlit:
    environment:
      - API_BASE_URL=http://api:8000
    # Streamlit watches the filesystem itself, so the mount is all that is
    # needed for live edits to the UI pages.
    volumes:
      - ./src/ui:/app/src/ui

  postgres:
    # Exposed on the host so a local psql / DBeaver session can inspect the
    # audit log and evaluation tables directly. Not exposed in production.
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"
