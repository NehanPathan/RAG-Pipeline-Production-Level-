# Serves the built SPA and proxies the API onto the same origin.
#
# Same-origin matters for more than tidiness: the app reads the `X-Trace-Id`
# response header, and browsers hide custom headers on cross-origin responses
# unless the server explicitly exposes them. Proxying here makes production
# behave the way `npm run dev` does, and lets the API keep an empty CORS
# allow-list outside development.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressing on the fly. The bundle is ~1 MB raw and ~280 kB gzipped, and
    # the largest chunk (the charting library) is only fetched by the
    # dashboard and ops pages.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # Nothing here reveals a version to scan for.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- API

    location /api/ {
        # Resolved at request time, not at startup.
        #
        # `proxy_pass http://api:8000` with a literal hostname is resolved
        # while nginx loads its config, so the frontend container would refuse
        # to start whenever the API container was down or being recreated --
        # the UI would be unreachable because its backend was, which is
        # exactly when someone needs the UI to load and tell them so. Going
        # through a variable defers resolution to each request: nginx starts
        # regardless, and an unreachable API surfaces as a 502 that the app
        # renders as its own "cannot reach the API" state.
        #
        # 127.0.0.11 is Docker's embedded DNS server.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;

        # A variable proxy_pass does not perform the location-prefix
        # substitution, so the original URI has to be appended explicitly.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /chat is a text/event-stream. Buffering it would hold every
        # token until the response completed, turning a streaming answer into
        # a ten-second blank screen followed by a wall of text.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Ingestion of a drawing set is minutes of work and uploads are large;
        # the defaults (60s, 1 MB) would fail both.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        client_max_body_size  256m;
    }

    # --------------------------------------------------------------- Assets

    # Vite fingerprints every asset filename, so a hashed file is immutable and
    # a changed file has a different name. Caching these for a year is safe and
    # is what makes a redeploy cost one small HTML fetch.
    #
    # Set through add_header rather than `expires`, because the two together
    # emit two Cache-Control headers and clients are not obliged to agree on
    # which wins.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ------------------------------------------------------------ SPA shell

    # index.html itself is never cached: it is the only file that names the
    # current asset hashes, so a stale copy pins the browser to a deleted
    # bundle and the app fails to load after a deploy.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Client-side routing: /documents/<uuid> is a React route, not a file.
    # try_files performs an internal redirect that re-enters location matching,
    # so a deep link lands in the block above and picks up its headers.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
