global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: prod-rag

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # The collector's own metrics: without this, a collector that has stopped
  # forwarding spans looks identical to a system that has stopped producing
  # them.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
