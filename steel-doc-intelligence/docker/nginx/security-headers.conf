# Response headers applied to every location.
#
# In a separate file because of an nginx rule that is easy to get wrong: a
# location containing *any* `add_header` inherits *none* from its parent. So
# these cannot simply be declared once in the server block — the moment a
# location sets its own Cache-Control, the security headers silently vanish
# from exactly the response that needs them most (index.html). Every location
# that sets a header of its own includes this file too.
#
# No CDN, no remote fonts, no XHR to another origin — the API is proxied onto
# this one — so the policy can stay tight. `unsafe-inline` is granted to
# styles because React writes inline style attributes, and to scripts only for
# the pre-paint theme bootstrap in index.html, which exists to stop a reload
# flashing the wrong theme.

add_header X-Content-Type-Options  "nosniff"                          always;
add_header X-Frame-Options         "DENY"                             always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
add_header Cross-Origin-Opener-Policy "same-origin"                   always;
# Firebase sign-in exchanges credentials with Google directly, so those two
# hosts must be reachable or the browser refuses the request before it is
# sent -- and reports it identically to a network failure, which is a
# genuinely confusing thing to debug. They are named explicitly rather than
# widened to https:, so this file still says exactly where the page may talk.
#   identitytoolkit.googleapis.com  sign-in
#   securetoken.googleapis.com      ID-token refresh
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
