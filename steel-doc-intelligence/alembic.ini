[alembic]
script_location = src/infrastructure/database/postgres/migrations
prepend_sys_path = .
version_path_separator = os
# Deliberately blank: env.py falls back to DATABASE_URL from .env when this
# is empty, so the application and its migrations read one setting rather
# than two that can disagree. A URL hardcoded here silently wins over .env --
# which is how a migration aimed at this project ran against the *other*
# stack's database, still on 5432, and left this one with no schema at all.
#
# Override per-invocation when a specific target is wanted:
#   alembic -x sqlalchemy.url=postgresql+asyncpg://... upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
